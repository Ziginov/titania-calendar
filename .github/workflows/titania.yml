name: Titania calendar update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"
      timezone: "Europe/Helsinki"

permissions:
  contents: write

concurrency:
  group: titania-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install cryptography

      - name: Update Titania calendar
        env:
          TITANIA_TOKEN_KEY: ${{ secrets.TITANIA_TOKEN_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python titania_cloud.py

      - name: Commit updated calendar/state
        run: |
          git config user.name "titania-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add titania_work.ics titania_snapshot.json titania_refresh_token.enc
          if git diff --cached --quiet; then
            echo "No repository changes."
          else
            git commit -m "Update Titania calendar"
            git push
          fi
